# Stable task label (#W) plus active pane context (#T) in the iTerm tab.
set-option -g set-titles on
set-option -g set-titles-string '#W | #T'
set-window-option -g automatic-rename off
set-window-option -g allow-rename off

# F8 explicitly enters manual mode; Agent-emitted transient names remain auto.
bind-key -n F8 command-prompt -p '(rename-window) ' "set-window-option @ctx_manual 1 \; set-window-option -u @ctx_auto_owned \; set-window-option -u @ctx_auto_title \; rename-window '%%'"

